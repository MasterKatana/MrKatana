<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilix | Shop</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#121212;
    --panel:#232323;
    --green:#55ff55;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'VT323', monospace;
    background:var(--bg);
    color:white;

    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

    background-size:16px 16px;
}

header{
    width:95%;
    max-width:1200px;

    margin:30px auto;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:var(--panel);

    border:4px solid #000;

    padding:20px;

    box-shadow:8px 8px 0 #000;
}

.logo{
    font-size:4rem;
    color:var(--green);
    text-shadow:4px 4px 0 #000;
}

.nav a{
    text-decoration:none;
    color:white;
    font-size:2rem;

    background:#333;

    padding:10px 20px;

    border:4px solid #000;

    box-shadow:4px 4px 0 #000;
}

.nav a:hover{
    background:var(--green);
    color:#000;
}

.title{
    text-align:center;
    font-size:5rem;
    margin:40px 0;

    color:var(--green);

    text-shadow:4px 4px 0 #000;
}

.grid{
    width:95%;
    max-width:1300px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:25px;
}

.card{
    background:var(--panel);

    border:4px solid #000;

    padding:15px;

    box-shadow:8px 8px 0 #000;
}

.card:hover{
    transform:translate(-4px,-4px);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;

    border:4px solid #000;

    image-rendering:pixelated;
}

.card h3{
    font-size:2rem;
    margin-top:10px;
}

.price{
    color:var(--green);
    font-size:2rem;
    margin:10px 0;
}

.btn{
    display:block;
    text-align:center;

    text-decoration:none;

    background:#2f7f2f;
    color:white;

    padding:10px;

    border:4px solid #000;

    font-size:1.8rem;

    box-shadow:4px 4px 0 #000;
}

.btn:hover{
    background:var(--green);
    color:#000;
}

footer{
    margin-top:70px;
    background:#0d0d0d;
    padding:40px;
    text-align:center;
    border-top:4px solid #000;
    font-size:1.7rem;
}
</style>
</head>
<body>

<header>
<div class="logo">PILIX</div>

<div class="nav">
<a href="index.html">HOME</a>
</div>
</header>

<h1 class="title">PIXEL SHOP</h1>

<section class="grid">

<div class="card">
<img src="https://uploadkon.ir/uploads/da6725_26aaaa.gif">
<h3>GameOver Cape</h3>
<div class="price">100,000 IRT</div>
<a href="#" class="btn">BUY NOW</a>
</div>

<div class="card">
<img src="https://uploadkon.ir/uploads/11e025_26modaaaael.gif">
<h3>Hack Cape</h3>
<div class="price">190,000 IRT</div>
<a href="#" class="btn">BUY NOW</a>
</div>

<div class="card">
<img src="https://uploadkon.ir/uploads/473e25_26coffe.gif">
<h3>Coffee Cape</h3>
<div class="price">90,000 IRT</div>
<a href="#" class="btn">BUY NOW</a>
</div>

<div class="card">
<img src="https://uploadkon.ir/uploads/38df25_26waish.gif">
<h3>Waish Eye Cape</h3>
<div class="price">70,000 IRT</div>
<a href="#" class="btn">BUY NOW</a>
</div>

</section>

<footer>
WELCOME TO PILIX PIXEL MARKET
</footer>

</body>
</html>
