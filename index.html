<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MrKatana | Info</title>


<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}


body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

color:white;

overflow:hidden;

background:#000;

}



/* background video */

.bg{

position:fixed;

width:100%;
height:100%;

object-fit:cover;

z-index:-2;

filter:brightness(.35);

}



body::before{

content:"";

position:fixed;

inset:0;

background:rgba(0,0,0,.55);

z-index:-1;

}



/* card */


.card{

width:390px;

padding:40px 25px;

text-align:center;

background:rgba(255,255,255,.08);

border-radius:30px;

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.25);


box-shadow:

0 0 40px #000,
0 0 100px white;


animation:show 1s ease;

}





@keyframes show{

from{

opacity:0;

transform:translateY(50px);

}


to{

opacity:1;

transform:translateY(0);

}

}





/* avatar */


.avatar{

width:130px;

height:130px;

border-radius:50%;

object-fit:cover;

border:4px solid white;


box-shadow:

0 0 30px white,
0 0 80px white;


}





.name{

font-size:32px;

margin-top:20px;

font-weight:bold;

}





.bio{

margin-top:12px;

color:#ddd;

font-size:16px;

}





/* social icons */


.links{

margin-top:35px;

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

}



.links a{


width:58px;

height:58px;


display:flex;

align-items:center;

justify-content:center;


border-radius:20px;


background:rgba(255,255,255,.12);


color:white;


font-size:28px;


text-decoration:none;


transition:.3s;


}





.links a:hover{


transform:

translateY(-10px)
scale(1.15);


background:white;

color:black;


box-shadow:

0 0 35px white;


}





</style>


</head>



<body>




<video class="bg" autoplay muted loop>


<source src="background.mp4" type="video/mp4">


</video>





<div class="card">





<img class="avatar" src="avatar.png">






<div class="name">

MrKatana

</div>





<div class="bio">

Streamer • Content Creator • Designer

</div>

</a>





</div>






</div>





</body>
