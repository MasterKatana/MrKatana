<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilix | Pixel Store</title>

<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#141414;
    --panel:#242424;
    --green:#55ff55;
    --green-dark:#2d7d2d;
    --text:#f5f5f5;
    --border:#000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'VT323', monospace;
    background-color:var(--bg);
    color:var(--text);
    image-rendering:pixelated;

    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

    background-size:16px 16px;
}

header{
    width:95%;
    max-width:1100px;
    margin:30px auto;

    background:var(--panel);
    border:4px solid var(--border);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px;

    box-shadow:8px 8px 0 #000;
}

.logo{
    font-size:4rem;
    color:var(--green);
    letter-spacing:4px;
    text-shadow:4px 4px 0 #000;
}

.nav{
    display:flex;
    gap:20px;
}

.nav a{
    text-decoration:none;
    color:white;
    font-size:2rem;
    border:3px solid #000;
    padding:8px 18px;
    background:#333;

    box-shadow:4px 4px 0 #000;
}

.nav a:hover{
    transform:translate(-2px,-2px);
    background:var(--green);
    color:#000;
}

.hero{
    width:95%;
    max-width:1100px;
    margin:auto;

    border:4px solid #000;
    box-shadow:10px 10px 0 #000;

    overflow:hidden;
}

.hero img{
    width:100%;
    display:block;
    image-rendering:pixelated;
}

.title{
    text-align:center;
    margin:60px 0 30px;
    font-size:4rem;
    color:var(--green);
    text-shadow:4px 4px 0 #000;
}

.products{
    width:95%;
    max-width:1200px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.card{
    background:var(--panel);
    border:4px solid #000;
    padding:15px;

    box-shadow:8px 8px 0 #000;
}

.card:hover{
    transform:translate(-4px,-4px);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    border:4px solid #000;
    image-rendering:pixelated;
}

.card h3{
    font-size:2rem;
    margin-top:12px;
}

.price{
    color:var(--green);
    font-size:2rem;
    margin:10px 0;
}

.btn{
    display:block;
    text-align:center;
    text-decoration:none;

    background:var(--green-dark);
    color:white;

    border:4px solid #000;
    padding:10px;

    font-size:1.8rem;

    box-shadow:4px 4px 0 #000;
}

.btn:hover{
    background:var(--green);
    color:#000;
}

footer{
    margin-top:70px;
    padding:40px;
    background:#0d0d0d;
    border-top:4px solid #000;
    text-align:center;
    font-size:1.7rem;
}

@media(max-width:768px){
    header{
        flex-direction:column;
        gap:20px;
    }

    .logo{
        font-size:3rem;
    }
}
</style>
</head>
<body>

<header>
    <div class="logo">PILIX</div>

    <div class="nav">
        <a href="shop.html">SHOP</a>
        <a href="login.html">LOGIN</a>
    </div>
</header>

<section class="hero">
    <img src="https://uploadkon.ir/uploads/128725_26Untitled181-20260525164652.png">
</section>

<h1 class="title">SPECIAL DROPS</h1>

<section class="products">

<div class="card">
<img src="https://uploadkon.ir/uploads/da6725_26aaaa.gif">
<h3>GameOver Cape</h3>
<div class="price">100,000 IRT</div>
<a href="#" class="btn">ADD TO CART</a>
</div>

<div class="card">
<img src="https://uploadkon.ir/uploads/11e025_26modaaaael.gif">
<h3>Hack Cape</h3>
<div class="price">190,000 IRT</div>
<a href="#" class="btn">ADD TO CART</a>
</div>

<div class="card">
<img src="https://uploadkon.ir/uploads/473e25_26coffe.gif">
<h3>Coffee Cape</h3>
<div class="price">90,000 IRT</div>
<a href="#" class="btn">ADD TO CART</a>
</div>

<div class="card">
<img src="https://uploadkon.ir/uploads/38df25_26waish.gif">
<h3>Waish Eye Cape</h3>
<div class="price">70,000 IRT</div>
<a href="#" class="btn">ADD TO CART</a>
</div>

</section>

<footer>
PILIX © 2026 — PIXEL STORE
</footer>

</body>
</html>
