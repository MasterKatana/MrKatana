<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MrKatana | Info</title>

<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
url("background.mp4");

background-size:cover;
background-position:center;

color:white;
overflow:hidden;

}



.card{

width:390px;

padding:40px 25px;

text-align:center;

background:rgba(255,255,255,.08);

border-radius:30px;

backdrop-filter:blur(20px);

border:1px solid #ffffff33;

box-shadow:
0 0 40px #000,
0 0 90px #ffffffaa;

animation:up 1s;

}



@keyframes up{

from{
opacity:0;
transform:translateY(50px);
}

to{
opacity:1;
transform:translateY(0);
}

}




.avatar{

width:130px;
height:130px;

border-radius:50%;

object-fit:cover;

border:4px solid white;

box-shadow:
0 0 25px white,
0 0 60px #ffffffaa;

}



.name{

font-size:32px;
margin-top:18px;

}



.bio{

color:#ddd;
margin:12px;

}



.links{

margin-top:30px;

display:grid;

grid-template-columns:repeat(5,1fr);

gap:15px;

}



.links a{

height:55px;

display:flex;
align-items:center;
justify-content:center;

border-radius:18px;

background:#ffffff15;

color:white;

font-size:25px;

text-decoration:none;

transition:.3s;

}



.links a:hover{

transform:translateY(-10px) scale(1.1);

background:white;

color:black;

box-shadow:
0 0 25px white,
0 0 50px #ffffffaa;

}


</style>

</head>


<body>


<div class="card">


<img class="avatar" src="avatar.png">


<div class="name">
MrKatana
</div>


<div class="bio">
Streamer • Content Creator • Designer
</div>



<div class="links">


<a href="https://discord.gg/6TP3bwmpTt">
<i class="fab fa-discord"></i>
</a>


<a href="https://www.aparat.com/MasterKatana">
<i class="fa-solid fa-play"></i>
</a>


<a href="https://www.youtube.com/@Master_katana">
<i class="fab fa-youtube"></i>
</a>


<a href="https://github.com/MasterKatana">
<i class="fab fa-github"></i>
</a>


<a href="https://open.spotify.com/user/31nej2bpfzdclwtxnaqzaribjmiu?si=b2b67862d1d74cea">
<i class="fab fa-spotify"></i>
</a>


</div>


</div>


</body>
</html>
