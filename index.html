<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MrKatana</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

height:100vh;

display:flex;
align-items:center;
justify-content:center;

color:white;

overflow:hidden;

background:#000;

}



/* background video */

.bg{

position:fixed;

width:100%;
height:100%;

object-fit:cover;

z-index:-2;

filter:brightness(.35);

}



body::after{

content:"";

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

z-index:-1;

}





.profile{

text-align:center;

animation:fade 1s ease;

}




@keyframes fade{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0);

}

}




.avatar{

width:120px;
height:120px;

border-radius:50%;

object-fit:cover;


border:3px solid white;


box-shadow:

0 0 25px white,
0 0 70px white;


}



.name{

margin-top:20px;

font-size:38px;

font-weight:bold;


text-shadow:

0 0 20px white;


}



.bio{

margin-top:12px;

font-weight:bold;

letter-spacing:1px;

}



.location{

margin-top:20px;

color:#ddd;

}



.location i{

filter:

drop-shadow(0 0 10px white);

}





.links{

margin-top:35px;

display:flex;

justify-content:center;

gap:22px;


}




.links a{

font-size:35px;

color:white;

text-decoration:none;


filter:

drop-shadow(0 0 15px white);


transition:.25s;


}



.links a:hover{

transform:

translateY(-8px)
scale(1.2);


filter:

drop-shadow(0 0 30px white);


}




.views{

margin-top:40px;

font-size:14px;

color:#ddd;

}



</style>


</head>


<body>



<video class="bg" autoplay muted loop>

<source src="background.mp4" type="video/mp4">

</video>





<div class="profile">





<img class="avatar" src="avatar.png">





<div class="name">

MrKatana

</div>





<div class="bio">

STREAMER • CONTENT CREATOR • DESIGNER

</div>





<div class="location">

<i class="fa-solid fa-location-dot"></i>

Iran | Tehran

</div>





<div class="links">


<a href="https://discord.gg/6TP3bwmpTt">
<i class="fab fa-discord"></i>
</a>


<a href="https://www.aparat.com/MasterKatana">
<i class="fa-solid fa-camera-retro"></i>
</a>


<a href="https://www.youtube.com/@Master_katana">
<i class="fab fa-youtube"></i>
</a>


<a href="https://github.com/MasterKatana">
<i class="fab fa-github"></i>
</a>


<a href="https://open.spotify.com/user/31nej2bpfzdclwtxnaqzaribjmiu">
<i class="fab fa-spotify"></i>
</a>


</div>




</body>

</html>
